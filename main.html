<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section - Fit Image Fix</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: #000; /* Dark background for the whole page */
        }

        /* --- Hero Section --- */
        .hero {
            height: 100vh;
            width: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            background-color: #111; /* Dark backdrop for the images */
            overflow: hidden;
        }

        .hero-slider {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            /* --- THE FIX IS HERE --- */
            background-size: contain;      /* Fits the whole image without cutting */
            background-position: center;   /* Centers the image */
            background-repeat: no-repeat;  /* Prevents the image from tiling */
            /* ----------------------- */
            
            opacity: 0;
            transition: opacity 1.5s ease-in-out; /* Smooth 3-second crossfade */
        }

        .slide.active {
            opacity: 1;
        }

        /* Dark overlay to make text readable */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4); 
            z-index: 1;
        }

        /* Text Content */
        .hero-content {
            position: relative;
            z-index: 2;
            padding: 0 20px;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 6vw, 5rem);
            margin-bottom: 15px;
            letter-spacing: 4px;
        }

        .hero p {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <section id="home" class="hero">
        <div class="hero-slider" id="heroSlider">
            <div class="slide active" style="background-image: url('images/1.jpeg');"></div>
            <div class="slide" style="background-image: url('images/2.jpeg');"></div>
            <div class="slide" style="background-image: url('images/3.jpeg');"></div>
            <div class="overlay"></div>
        </div>
        <div class="hero-content">
            <h1>The Art of Photography</h1>
            <p>Capturing moments, creating memories.</p>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const slides = document.querySelectorAll('.slide');
            let currentSlide = 0;
            const slideInterval = 3000; // 3 seconds per image

            function nextSlide() {
                // Remove active class from current slide
                slides[currentSlide].classList.remove('active');
                
                // Move to next slide, loop back to 0 if at the end
                currentSlide = (currentSlide + 1) % slides.length;
                
                // Add active class to new slide
                slides[currentSlide].classList.add('active');
            }

            // Start the slider if there are images
            if (slides.length > 0) {
                setInterval(nextSlide, slideInterval);
            }
        });
    </script>
</body>
</html>
